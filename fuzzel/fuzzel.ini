[main]
# Default font (let fuzzel pick from system)
font=Adwaita Mono:size=7
dpi-aware=yes
prompt=">"
terminal=kitty
icon-theme=Tela
width=25
lines=10
horizontal-pad=10
vertical-pad=10
inner-pad=10

[colors]
background=000000ff
text=cdd6f4ff

match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=74c7ecff


border=dddddddd


[border]
width=2
radius=7

[dmenu]
mode=text

[key-bindings]
cancel=Escape
execute=Return

# Mouse scroll
scroll-wheel-up=ScrollUp
scroll-wheel-down=ScrollDown
include=~/.config/fuzzel/themes/quickz
