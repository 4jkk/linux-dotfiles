
# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,1920x1080@120,auto,1.33
monitor=HDMI-A-1,1920x1080@60,auto,1
xwayland {
    force_zero_scaling = true
}
# Set programs that you use
$terminal = kitty
$fileManager = dolphin


# exec-once = $terminal
# exec-once = nm-applet &
exec-once = swww-daemon
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = hyprlock
