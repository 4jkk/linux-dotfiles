#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_THEME,Adwaita

# GTK Theme settings
env = GTK_THEME,Catppuccin-Dark-Compact

# Font settings - GG Sans system-wide
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_FONT_DPI,120

# GG Sans font configuration
env = FREETYPE_PROPERTIES,truetype:interpreter-version=38
env = GTK_FONT_NAME,gg sans Normal 13

# Font rendering
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 15

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(6e2c3aff)
    col.active_border = rgba(4d2fb2dd)
    col.inactive_border = rgba(bde8f5cc)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     3.5,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
# gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
# }

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Omarchy keybindings imported from https://github.com/basecamp/omarchy
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

################
### TILING & WINDOW MANAGEMENT ###
################

# Window Management
bind = $mainMod, W, killactive,                      # Close active window
bind = CTRL ALT, Delete, exec, hyprctl kill          # Close all windows
bind = $mainMod, T, togglefloating,                  # Toggle floating/tiling mode
bind = $mainMod, F, fullscreen, 0                    # Fullscreen mode
bind = $mainMod CTRL, F, fullscreen, 1               # Tiled fullscreen
# bind = $mainMod ALT, F, fakefullscreen             # Full width mode (DISABLED - dispatcher removed in newer Hyprland)
    bind = $mainMod, O, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin  # Pop window out (float & pin)
# Window Focus & Navigation
bind = $mainMod, left, movefocus, l                  # Move focus left
bind = $mainMod, right, movefocus, r                 # Move focus right
bind = $mainMod, up, movefocus, u                    # Move focus up
bind = $mainMod, down, movefocus, d                  # Move focus down
bind = ALT, Tab, cyclenext,                          # Cycle to next window
bind = ALT SHIFT, Tab, cyclenext, prev               # Cycle to previous window

# Workspace Management
bind = $mainMod, 1, workspace, 1                     # Switch to workspace 1
bind = $mainMod, 2, workspace, 2                     # Switch to workspace 2
bind = $mainMod, 3, workspace, 3                     # Switch to workspace 3
bind = $mainMod, 4, workspace, 4                     # Switch to workspace 4
bind = $mainMod, 5, workspace, 5                     # Switch to workspace 5
bind = $mainMod, 6, workspace, 6                     # Switch to workspace 6
bind = $mainMod, 7, workspace, 7                     # Switch to workspace 7
bind = $mainMod, 8, workspace, 8                     # Switch to workspace 8
bind = $mainMod, 9, workspace, 9                     # Switch to workspace 9
bind = $mainMod, Tab, workspace, e+1                 # Next workspace
bind = $mainMod SHIFT, Tab, workspace, e-1           # Previous workspace
bind = $mainMod CTRL, Tab, workspace, previous       # Return to former workspace
bind = $mainMod, mouse_down, workspace, e+1          # Scroll through workspaces
bind = $mainMod, mouse_up, workspace, e-1            # Scroll through workspaces

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1         # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2         # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3         # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4         # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5         # Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6         # Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7         # Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8         # Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9         # Move window to workspace 9

# Window Tiling & Layout
bind = $mainMod, J, togglesplit,                     # Toggle window split
bind = $mainMod, P, pseudo,                          # Pseudo window mode

# Window Swapping
bind = $mainMod SHIFT, left, swapwindow, l           # Swap window left
bind = $mainMod SHIFT, right, swapwindow, r          # Swap window right
bind = $mainMod SHIFT, up, swapwindow, u             # Swap window up
bind = $mainMod SHIFT, down, swapwindow, d           # Swap window down


# Scratchpad
bind = $mainMod, grave, togglespecialworkspace, magic    # Toggle scratchpad
bind = $mainMod ALT, grave, movetoworkspace, special:magic  # Move window to scratchpad

# Window Groups
bind = $mainMod, G, togglegroup,                     # Toggle grouping
bind = $mainMod ALT, G, lockactivegroup, toggle      # Remove window from group
bind = $mainMod ALT, left, moveintogroup, l          # Move window into group left
bind = $mainMod ALT, right, moveintogroup, r         # Move window into group right
bind = $mainMod ALT, up, moveintogroup, u            # Move window into group up
bind = $mainMod ALT, down, moveintogroup, d          # Move window into group down
bind = $mainMod ALT, Tab, changegroupactive, f       # Cycle through group windows
bind = $mainMod ALT, 1, changegroupactive, 1         # Activate group window 1
bind = $mainMod ALT, 2, changegroupactive, 2         # Activate group window 2
bind = $mainMod ALT, 3, changegroupactive, 3         # Activate group window 3
bind = $mainMod ALT, 4, changegroupactive, 4         # Activate group window 4
bind = $mainMod ALT, 5, changegroupactive, 5         # Activate group window 5

# Mouse Controls
bindm = $mainMod, mouse:272, movewindow              # Move window with mouse
bindm = $mainMod, mouse:273, resizewindow            # Resize window with mouse

#Utils
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# Application Launcher & Menus
bind = $mainMod, Return, exec, $terminal             # Launch terminal
bind = $mainMod, Space, exec, fuzzel                  # Launch apps
bind = $mainMod CTRL, E, exec, $menu                 # Emoji picker (configure your menu for emoji support)
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/powermenu.sh  # Power menu
# bind = XF86PowerOff, exec, $menu                   # Power menu (DISABLED - key doesn't exist on most keyboards)
bind = $mainMod, K, exec, $menu                      # Show key bindings (configure if you have a keybindings viewer)
# bind = XF86Calculator, exec, gnome-calculator      # Calculator (DISABLED - app not installed)

# Application Shortcuts
bind = $mainMod SHIFT, F, exec, $fileManager         # File manager
bind = $mainMod SHIFT, B, exec, zen-browser             # Browser
bind = $mainMod SHIFT ALT, B, exec, zen-browser --private-window  # Browser (private)
bind = $mainMod SHIFT, G, exec, zen-browser https://github.com/ajthkmr  # GitHub profile
bind = $mainMod SHIFT, N, exec, nvim                 # Editor

# Clipboard Operations
bind = $mainMod, C, exec, wtype -M ctrl -P c -m ctrl -p c  # Copy (Super+C)
bind = $mainMod, V, exec, wtype -M ctrl -P v -m ctrl -p v  # Paste (Super+V)
bind = $mainMod, X, exec, wtype -M ctrl -P x -m ctrl -p x  # Cut (Super+X)
bind = $mainMod CTRL, V, exec, $menu                        # Clipboard manager (configure your menu for clipboard history)

# Aesthetics & Display
# bind = $mainMod SHIFT, Space, exec, killall -SIGUSR1 waybar  # Toggle top bar (if using waybar)
bind = $mainMod ALT, Space, exec, ~/.config/hypr/scripts/cycle_wallpaper.sh  # Cycle wallpaper
bind = $mainMod, Backspace, exec, hyprctl setprop active opaque toggle  # Toggle window transparency
bind = $mainMod SHIFT, Backspace, exec, hyprctl keyword general:gaps_in 0,5 && hyprctl keyword general:gaps_out 0,20  # Toggle workspace gaps

# System Controls
bind = $mainMod, L, exec, hyprlock                   # Lock screen
bind = $mainMod CTRL, I, exec, hypridle toggle       # Toggle locking on idle (if using hypridle)
bind = $mainMod CTRL, N, exec, hyprshade toggle      # Toggle nightlight (if using hyprshade)

# Captures & Screenshots
# bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -  # Screenshot with editing
# bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy  # Screenshot to clipboard
bind = ALT, Print, exec, wf-recorder                 # Screen recording (install wf-recorder)
bind = $mainMod, Print, exec, hyprpicker -a          # Color picker
#MEDIA & HARDWARE CONTROLS

# Volume & Audio Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
bindel = ALT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

# Brightness Controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ALT, XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = ALT, XF86MonBrightnessDown, exec, brightnessctl set 1%-

# Media Playback (Requires playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Audio Output Switch
bind = $mainMod, XF86AudioMute, exec, wpctl set-default $(wpctl status | grep "Sinks:" -A 20 | grep -v "*" | head -n 2 | tail -n 1 | awk '{print $2}' | sed 's/\.//')  # Switch audio output device

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Workspace names (Roman numerals) - First 4 are persistent
workspace = 1, name:I, persistent:true
workspace = 2, name:II, persistent:true
workspace = 3, name:III, persistent:true
workspace = 4, name:IV, persistent:true
workspace = 5, name:V
workspace = 6, name:VI

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL, Print, exec, grim ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S').png
device {
    name = dell0d7a:01-27c6:0d43-touchpad
    tap-to-click = true
    clickfinger_behavior = true
    natural_scroll = true
}
