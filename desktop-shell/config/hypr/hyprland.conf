# Desktop Shell — Hyprland configuration

monitor = eDP-1,1920x1080@120,0x0,1.1
monitor = HDMI-A-1,1920x1080@179.999,1746x0,1
monitor = ,preferred,auto,1

$terminal = ghostty
$fileManager = nemo
$launcher = fuzzel
$browser = /home/akk/.local/bin/zen-browser

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /home/akk/.config/desktop-shell/apply-wallpaper.sh
exec-once = quickshell -c desktop-shell

input {
    kb_layout = us
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    natural_scroll = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ff0000bb)
    col.inactive_border = rgba(87704fff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Window management
bind = SUPER, W, killactive
bind = SUPER, T, togglefloating
bind = SUPER, O, togglefloating
bind = SUPER, F, fullscreen, 1
bind = SUPER CTRL, F, fullscreen, 0

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER CTRL, left, focusmonitor, l
bind = SUPER CTRL, right, focusmonitor, r

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT CTRL, left, movewindow, mon:l
bind = SUPER SHIFT CTRL, right, movewindow, mon:r

# Closest Hyprland equivalents to Niri's consume/expel and width preset actions.
bind = SUPER, J, togglesplit
bind = SUPER, P, pseudo

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, Page_Down, workspace, r+1
bind = SUPER, Page_Up, workspace, r-1
bind = SUPER, mouse_down, workspace, r+1
bind = SUPER, mouse_up, workspace, r-1

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER CTRL, Page_Down, movetoworkspace, r+1
bind = SUPER CTRL, Page_Up, movetoworkspace, r-1

# Applications and shell
bind = SUPER, Return, exec, $terminal
bind = SUPER, Space, exec, $launcher
bind = ALT, Space, exec, /home/akk/.config/desktop-shell/control-center.sh
bind = SUPER, Escape, exec, /home/akk/.config/desktop-shell/control-center.sh
bind = SUPER SHIFT, F, exec, $fileManager
bind = SUPER SHIFT, B, exec, $browser
bind = SUPER SHIFT ALT, B, exec, $browser --private-window
bind = SUPER SHIFT, G, exec, $browser https://github.com/ajthkmr
bind = SUPER SHIFT, N, exec, $terminal -e nvim
bind = ALT, Y, exec, $browser --new-window https://youtube.com
bind = ALT, G, exec, $browser --new-tab https://github.com/

# Session and screenshots
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER CTRL, I, exec, loginctl lock-session
bind = SUPER, S, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/Screenshot from $(date +%Y-%m-%d_%H-%M-%S).png"'
bind = SUPER SHIFT, E, exit
bind = CTRL ALT, Delete, exit

# Media and hardware controls (also work while locked).
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
bindel = ALT, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = ALT, XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = ALT, XF86MonBrightnessDown, exec, brightnessctl set 1%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = ALT, Print, exec, wf-recorder

# Picture-in-picture windows float by default.
windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$

